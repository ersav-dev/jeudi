<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>jeudi — l'étiquette de cire : et une fois lue ?</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{--nuit:#14120e;--nuit-2:#1b1813;--encre:#efe9d8;--encre-2:rgba(239,233,216,.62);
        --encre-3:rgba(239,233,216,.4);--cire:#a8322a;--graphite:#8a857a;--blanc:#f7f3e8}
  *{box-sizing:border-box;margin:0}
  body{background:var(--nuit);color:var(--encre);font-family:'JetBrains Mono',monospace;
       padding:20px 16px 60px;max-width:820px;margin:0 auto}
  h1{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:26px}
  .sous{font-size:11px;color:var(--encre-3);letter-spacing:.5px;margin:3px 0 22px}
  .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:24px 14px}
  .carte{text-align:center}
  .num{font-size:10px;color:var(--encre-3);letter-spacing:1px}
  .titre{font-family:'Instrument Serif',serif;font-style:italic;font-size:17px;margin:1px 0 10px}
  .scene{cursor:pointer;padding-bottom:4px}
  .note{font-size:10px;color:var(--encre-2);line-height:1.5;margin-top:8px;min-height:44px}
  .etat{font-family:'Caveat',cursive;font-size:14px;color:var(--encre-3);height:18px;margin-top:2px}

  .tas{position:relative;width:72px;margin:0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
  .tas .f{position:absolute;inset:0;width:100%;aspect-ratio:1;object-fit:cover;
          border:3px solid var(--blanc);border-bottom-width:11px;background:var(--nuit-2);
          box-shadow:0 1px 2px rgba(0,0,0,.5)}
  .tas .f.b1{transform:rotate(7deg) translate(4%,-3%)}
  .tas .f.b2{transform:rotate(-8deg) translate(-4%,2%)}
  .tas .haut{position:relative;display:block;transform:rotate(-2deg)}
  .lig{margin-top:10px;font-size:11px;line-height:1.4}
  .heure{color:var(--encre-3);font-size:10px}

  /* L'ÉTAT « PAS VU » — commun à tous : l'étiquette de cire */
  .nom{background:var(--cire);color:#fff;padding:2px 8px;display:inline-block;
       transform:rotate(-1.5deg);transition:all .45s cubic-bezier(.2,.8,.2,1);position:relative}

  /* 01 → nom normal (encre) */
  .v1.vu .nom{background:transparent;color:var(--encre);transform:none;padding:2px 0}
  /* 02 → nom effacé (crayon) */
  .v2.vu .nom{background:transparent;color:var(--encre-3);transform:none;padding:2px 0}
  /* 03 → nom barré */
  .v3.vu .nom{background:transparent;color:var(--encre-2);transform:none;padding:2px 0;
              text-decoration:line-through;text-decoration-color:var(--cire);text-decoration-thickness:2px}
  /* 04 → étiquette en contour */
  .v4.vu .nom{background:transparent;color:var(--cire);box-shadow:inset 0 0 0 1px var(--cire)}
  /* 05 → étiquette graphite */
  .v5.vu .nom{background:var(--graphite);color:#14120e;transform:rotate(-1.5deg)}
  /* 06 → étiquette ivoire (le tampon posé) */
  .v6.vu .nom{background:var(--encre);color:#14120e;transform:rotate(-1.5deg)}
  /* 07 → l'étiquette glisse et tombe */
  .v7 .nom{overflow:hidden}
  .v7 .nom::before{content:'';position:absolute;inset:0;background:var(--cire);
                   transition:transform .5s cubic-bezier(.4,0,.2,1)}
  .v7 .nom{background:transparent;color:#fff}
  .v7 .nom span{position:relative;z-index:2;transition:color .3s .2s}
  .v7.vu .nom::before{transform:translateY(105%)}
  .v7.vu .nom{transform:none;padding:2px 0}
  .v7.vu .nom span{color:var(--encre-3)}
  /* 08 → la main change */
  .v8.vu .nom{background:transparent;color:var(--encre-3);transform:none;padding:2px 0;
              font-family:'Caveat',cursive;font-size:17px}

  .banc{margin-top:38px;border-top:1px solid rgba(239,233,216,.14);padding-top:20px}
  .banc h2{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:19px;margin-bottom:4px}
  .banc p{font-size:10px;color:var(--encre-3);margin-bottom:16px;letter-spacing:.5px}
  .rangee{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;
          background:#181510;border-radius:10px;padding:22px 14px}
  .pied{margin-top:26px;font-family:'Caveat',cursive;font-size:17px;color:var(--encre-2);text-align:center}
</style>
</head>
<body>
<h1>l'étiquette de cire — et une fois lue ?</h1>
<p class="sous">MÊME ÉTAT « PAS VU » · 8 SORTIES POSSIBLES · TAPE POUR BASCULER</p>

<div class="grille" id="g"></div>

<div class="banc">
  <h2>le vrai test : deux pas vus, trois lus</h2>
  <p>AVEC LA SORTIE 02 (LE CRAYON) — CHANGE LA DANS LE CODE POUR COMPARER</p>
  <div class="rangee" id="r"></div>
</div>

<p class="pied">une étiquette qu'on retire, ce n'est pas une tâche qu'on coche.</p>

<script>
  const P=(k)=>`https://loremflickr.com/300/300/bar,paris,night/all?lock=${k}`
  const V=[
    {t:'le crayon clair', n:'l’étiquette tombe, le nom reste bien lisible à l’encre. neutre, sans jugement.'},
    {t:'le crayon effacé', n:'l’étiquette tombe et le nom recule. la carte se calme à mesure qu’on lit.'},
    {t:'barré', n:'le nom rayé de cire. lisible… mais « karim » barré, ça se lit comme karim annulé.'},
    {t:'l’étiquette vidée', n:'le fond part, le contour reste. on voit qu’il y a eu quelque chose ici.'},
    {t:'l’étiquette graphite', n:'même forme, encre morte. la cire ne sert qu’au frais.'},
    {t:'le tampon ivoire', n:'l’étiquette s’inverse : c’est tamponné, donc classé. très carnet.'},
    {t:'la cire qui glisse', n:'le fond rouge descend et découvre le nom au crayon. le geste le plus joli.'},
    {t:'la main change', n:'de l’étiquette imprimée à l’écriture manuscrite : ça devient une note à toi.'},
  ]
  const tas=(k)=>`<div class="tas">
      <img class="f b1" src="${P(200+k)}" alt=""/><img class="f b2" src="${P(300+k)}" alt=""/>
      <img class="f haut" src="${P(400+k)}" alt=""/></div>`

  document.getElementById('g').innerHTML=V.map((v,i)=>`
    <div class="carte v${i+1}">
      <div class="num">${String(i+1).padStart(2,'0')}</div>
      <div class="titre">${v.t}</div>
      <div class="scene">${tas(i)}
        <div class="lig"><span class="nom"><span>karim</span></span> <span class="heure">· 2h</span></div>
      </div>
      <div class="etat">pas encore vu</div>
      <div class="note">${v.n}</div>
    </div>`).join('')

  const NOMS=['karim','marie','léa','sofiane','inès']
  document.getElementById('r').innerHTML=NOMS.map((nm,i)=>`
    <div class="carte v2 ${i>1?'vu':''}" style="width:80px">
      <div class="scene">${tas(60+i)}
        <div class="lig"><span class="nom"><span>${nm}</span></span> <span class="heure">· ${2+i*8}h</span></div>
      </div>
    </div>`).join('')

  document.querySelectorAll('.carte .scene').forEach((s)=>{
    s.onclick=()=>{
      const c=s.parentElement
      c.classList.toggle('vu')
      const e=c.querySelector('.etat')
      if(e) e.textContent=c.classList.contains('vu')?'lu.':'pas encore vu'
    }
  })
</script>
</body>
</html>
