<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jeudi. — la carte du soir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Caveat:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── tokens (DESIGN V5 — l'objet, pas l'écran) ─────────────────── */
  :root {
    --nuit:     #14120E;
    --nuit-2:   #1B1813;
    --encre:    #EFE9D8;
    --encre-2:  rgba(239,233,216,.62);
    --encre-3:  rgba(239,233,216,.34);
    --cire:     #A8322A;
    --graphite: #8A857A;
    --rayon:    3px;
    --pose:     cubic-bezier(0.2, 0.8, 0.2, 1);
    --frappe:   cubic-bezier(0.6, 0, 0.4, 1);
    --tourne:   cubic-bezier(0.4, 0, 0.1, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0B0A08;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 0;
  }

  /* ── le carnet (cadre 390×844) ─────────────────────────────────── */
  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    background: var(--nuit);
    border: 1px solid rgba(239,233,216,.07);
    border-radius: var(--rayon);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 420px) {
    body { padding: 0; }
    .phone { width: 100vw; height: 100vh; border: none; border-radius: 0; }
  }

  /* grain feTurbulence — sur le FOND uniquement, sous le contenu */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .phone > header,
  .phone > .map,
  .phone > footer { position: relative; z-index: 1; }

  /* ── apparitions ───────────────────────────────────────────────── */
  /* l'encre ne fade pas : elle se dépose (opacité sèche + 4px) */
  .pose {
    animation: pose 120ms var(--pose) both;
    animation-delay: var(--d, 0ms);
  }
  @keyframes pose {
    0%   { opacity: 0; translate: 0 4px; }
    1%   { opacity: 1; }
    100% { opacity: 1; translate: 0 0; }
  }
  /* pour les éléments SVG : un pop d'encre, sans translation */
  .ink {
    animation: ink 10ms steps(1, end) both;
    animation-delay: var(--d, 0ms);
  }
  @keyframes ink { from { opacity: 0; } to { opacity: 1; } }

  /* le tracé graphite se dessine (via masque) */
  .trace-draw {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw 600ms var(--tourne) 150ms both;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* le tampon frappe — une seule fois, 90 ms */
  .stamp {
    animation: frappe 90ms var(--frappe) 980ms both;
  }
  @keyframes frappe {
    0%   { opacity: 0; scale: 1.15; }
    1%   { opacity: 1; }
    100% { opacity: 1; scale: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pose, .ink, .stamp { animation: none; }
    .trace-draw { animation: none; stroke-dashoffset: 0; }
  }

  /* ── tête ──────────────────────────────────────────────────────── */
  header {
    text-align: center;
    padding: 42px 24px 0;
  }
  header h1 {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 21px;
    line-height: 1.02;
    color: var(--encre);
  }
  header .kicker {
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .3em;
    color: var(--encre-3);
  }

  /* ── la carte ──────────────────────────────────────────────────── */
  .map {
    flex: 0 0 556px;
    margin-top: 10px;
    position: relative;
  }
  .map svg.trail-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* polaroïds — posés, pas flottants */
  .polaroid {
    position: absolute;
    width: 158px;
    background: #EFE9D8;
    padding: 6px 6px 0;
    border-radius: var(--rayon);
    box-shadow: 0 1px 0 rgba(0,0,0,.5);
  }
  .polaroid .photo {
    position: relative;
    height: 100px;
    overflow: hidden;
  }
  .polaroid .name {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 17px;
    line-height: 1.02;
    color: #2A2620;
    padding: 10px 3px 12px;
  }
  .p1 { left: 22px;  top: 12px;  rotate: -1.6deg; }
  .p2 { left: 210px; top: 180px; rotate: 1.8deg; }
  .p3 { left: 30px;  top: 372px; rotate: -1.1deg; }

  /* nuits simulées — dégradés sombres, pas de photos */
  .p1 .photo {
    background:
      radial-gradient(circle at 30% 25%, rgba(214,170,100,.26), transparent 60%),
      linear-gradient(155deg, #453723 0%, #2A211A 45%, #17130E 100%);
  }
  .p2 .photo {
    background:
      radial-gradient(circle at 65% 30%, rgba(196,120,60,.30), transparent 55%),
      linear-gradient(200deg, #3D2B20 0%, #191310 100%);
  }
  .p3 .photo {
    background:
      radial-gradient(circle at 50% 72%, rgba(150,64,48,.20), transparent 62%),
      linear-gradient(170deg, #2B2320 0%, #14110F 100%);
  }

  /* numéros manuscrits + méta */
  .step-label { position: absolute; white-space: nowrap; }
  .step-label .num {
    font-family: 'Caveat', cursive;
    font-weight: 500;
    font-size: 24px;
    line-height: 1;
    color: var(--encre);
    display: block;
  }
  .step-label .meta {
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
    color: var(--encre-3);
    display: block;
  }
  .l1 { left: 198px; top: 30px; }
  .l1 .num { rotate: -2deg; }
  .l2 { left: 8px; top: 198px; width: 156px; text-align: right; }
  .l2 .num { rotate: 1.5deg; }
  .l3 { left: 204px; top: 398px; }
  .l3 .num { rotate: -1deg; }

  /* LE tampon — unique élément cire de l'écran */
  .stamp {
    position: absolute;
    top: 32px;
    left: 16px;
    rotate: -12deg;
    border: 3px solid var(--cire);
    border-radius: var(--rayon);
    color: var(--cire);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .22em;
    padding: 5px 6px 4px 11px;
  }

  /* la note en marge — une main humaine, donc Caveat */
  .note {
    position: absolute;
    left: 16px;
    top: 306px;
    width: 168px;
    rotate: -3deg;
    font-family: 'Caveat', cursive;
    font-weight: 400;
    font-size: 21px;
    line-height: 1.15;
    color: var(--encre-2);
  }

  /* ── pied ──────────────────────────────────────────────────────── */
  footer {
    margin-top: auto;
    text-align: center;
    padding: 0 24px 34px;
  }
  .share {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: .14em;
    color: var(--encre);
    background: transparent;
    border: 1px dashed rgba(239,233,216,.38);
    border-radius: var(--rayon);
    padding: 13px 24px;
    cursor: pointer;
  }
  .share:active { translate: 0 1px; }
</style>
</head>
<body>

<div class="phone">

  <!-- grain : une seule couche, fond global uniquement -->
  <svg class="grain" width="100%" height="100%" aria-hidden="true">
    <filter id="grain-f">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#grain-f)" opacity="0.025"/>
  </svg>

  <header class="pose" style="--d: 60ms">
    <h1>jeudi 6 juillet</h1>
    <p class="kicker">la carte du soir</p>
  </header>

  <div class="map">

    <!-- le tracé au crayon graphite -->
    <svg class="trail-svg" viewBox="0 0 390 556" fill="none" aria-hidden="true">
      <defs>
        <mask id="reveal">
          <path class="trace-draw" pathLength="1" fill="none"
            stroke="#fff" stroke-width="8" stroke-linecap="round"
            d="M 252 12
               C 232 22, 212 30, 202 46
               C 188 70, 196 92, 216 108
               C 244 130, 268 148, 262 176
               C 258 196, 226 200, 206 216
               C 186 232, 208 260, 246 268
               C 300 280, 330 300, 322 330
               C 316 354, 260 356, 224 368
               C 190 380, 200 398, 208 414
               C 218 436, 250 452, 278 472
               C 300 488, 314 504, 318 522"/>
        </mask>
      </defs>

      <!-- point de départ -->
      <circle class="ink" style="--d: 150ms" cx="252" cy="12" r="2.5" fill="#8A857A"/>

      <!-- le pointillé de carte au trésor, discret -->
      <path mask="url(#reveal)" fill="none"
        stroke="#8A857A" stroke-opacity=".9" stroke-width="1.5"
        stroke-linecap="round" stroke-dasharray="7 8"
        d="M 252 12
           C 232 22, 212 30, 202 46
           C 188 70, 196 92, 216 108
           C 244 130, 268 148, 262 176
           C 258 196, 226 200, 206 216
           C 186 232, 208 260, 246 268
           C 300 280, 330 300, 322 330
           C 316 354, 260 356, 224 368
           C 190 380, 200 398, 208 414
           C 218 436, 250 452, 278 472
           C 300 488, 314 504, 318 522"/>

      <!-- terminus -->
      <path class="ink" style="--d: 780ms"
        stroke="#8A857A" stroke-width="1.8" stroke-linecap="round"
        d="M 312 516 l 12 12 M 324 516 l -12 12"/>
    </svg>

    <!-- étape 1 -->
    <div class="polaroid p1 pose" style="--d: 240ms">
      <div class="photo"></div>
      <div class="name">Aux Deux Amis</div>
    </div>
    <div class="step-label l1 pose" style="--d: 300ms">
      <span class="num">1.</span>
      <span class="meta">19h47 · on était 3</span>
    </div>

    <!-- étape 2 -->
    <div class="polaroid p2 pose" style="--d: 430ms">
      <div class="photo">
        <div class="stamp">VALIDÉ</div>
      </div>
      <div class="name">Pierre Sang</div>
    </div>
    <div class="step-label l2 pose" style="--d: 490ms">
      <span class="num">2.</span>
      <span class="meta">21h04 · on était 4</span>
    </div>

    <!-- étape 3 -->
    <div class="polaroid p3 pose" style="--d: 620ms">
      <div class="photo"></div>
      <div class="name">Café Charbon</div>
    </div>
    <div class="step-label l3 pose" style="--d: 680ms">
      <span class="num">3.</span>
      <span class="meta">23h52 · on était 4</span>
    </div>

    <!-- note en marge — c'est un humain qui parle -->
    <p class="note pose" style="--d: 840ms">le patron nous a offert le dernier verre</p>

  </div>

  <footer class="pose" style="--d: 900ms">
    <button class="share" type="button">partager la carte &rarr;</button>
  </footer>

</div>

</body>
</html>
